<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6f4a">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="apple-touch-icon" href="{{ '/assets/icon-180.png' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/icon-180.png' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}">🍽️ Dinners</a>
  <nav>
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>This week</a>
    <a href="{{ '/shopping-list/' | relative_url }}" {% if page.url contains 'shopping' %}aria-current="page"{% endif %}>Shopping</a>
    <a href="{{ '/cookbook/' | relative_url }}" {% if page.url contains 'cookbook' or page.collection == 'recipes' %}aria-current="page"{% endif %}>Cookbook</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer><a href="{{ '/weeks/' | relative_url }}">Past weeks</a></footer>
</body>
</html>
